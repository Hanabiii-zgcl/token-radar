<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Token Radar · AI token 使用追踪</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="data.js"></script>
<script src="valliance.js"></script>
<style>
  :root{
    --bg:#0b0e14; --panel:#141925; --panel2:#1b2230; --line:#222b3a;
    --fg:#e6edf3; --mut:#8b97a8; --acc:#5b9dff; --good:#3fb950; --bad:#f85149;
    --chip:#202a3a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
  a{color:var(--acc);text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 80px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:22px;margin:0;letter-spacing:.3px}
  .sub{color:var(--mut);font-size:12.5px}
  .meta{color:var(--mut);font-size:12px;margin:6px 0 18px}
  .banner{background:#241c0e;border:1px solid #5a4413;color:#e8c97a;
    padding:12px 14px;border-radius:10px;margin:14px 0;font-size:13px}
  .banner code{background:#000;padding:2px 6px;border-radius:5px;color:#ffd479}
  h2{font-size:14px;color:var(--mut);text-transform:uppercase;letter-spacing:1px;
    margin:34px 0 12px;font-weight:600}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .kpi .v{font-size:26px;font-weight:700;letter-spacing:.3px}
  .kpi .l{color:var(--mut);font-size:12px;margin-top:2px}
  .kpi .d{font-size:11.5px;margin-top:4px}
  .grid{display:grid;gap:16px}
  .g2{grid-template-columns:1fr 1fr}
  @media(max-width:820px){.g2{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h3{margin:0 0 2px;font-size:14px}
  .card .cs{color:var(--mut);font-size:12px;margin-bottom:10px}
  .chart{width:100%;height:300px}
  .chart.tall{height:360px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  .up{color:var(--good)} .down{color:var(--bad)}
  .tag{display:inline-block;background:var(--chip);color:var(--mut);
    border-radius:6px;padding:1px 7px;font-size:11px}
  .footnote{color:var(--mut);font-size:11.5px;margin-top:10px;line-height:1.6}
  .verified-no{color:#e8c97a}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Token Radar</h1>
    <span class="sub">AI token 使用 · 多源追踪</span>
  </header>
  <div class="meta" id="meta"></div>
  <div id="root"></div>
  <div class="footnote">
    口径说明：token 数来自各上游模型自己的 tokenizer，跨模型不严格可比。OpenRouter 数据是<b>第三方聚合层</b>——看结构与趋势，不代表市场总量。第一方(ChatGPT/Claude.ai/Gemini app)消费与直签企业大单不在其中，见下方「宏观口径」区。
  </div>
</div>
<script>
(async function(){
let D;
try{ const _r = await fetch('data/latest.json?ts=' + Date.now(), {cache:'no-store'}); D = _r.ok ? await _r.json() : (window.__DATA__ || {}); }
catch(_e){ D = window.__DATA__ || {}; }
let V;
try{ const _v = await fetch('data/valliance-latest.json?ts=' + Date.now(), {cache:'no-store'}); V = _v.ok ? await _v.json() : (window.__VDATA__ || null); }
catch(_e){ V = window.__VDATA__ || null; }
const VM = (V && V.modules) || {};
const $ = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const root = document.getElementById('root');

// ---- number formatting ----
function hum(n){
  if(n==null||isNaN(n))return '—';
  n=Number(n);
  const u=[[1e15,'Q'],[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']];
  for(const [v,s] of u){if(Math.abs(n)>=v){const x=n/v;return x.toFixed(x>=100?0:x>=10?1:2)+s;}}
  return n.toLocaleString();
}
function dod(p){
  if(p==null)return '';
  const c=p>=0?'up':'down', s=p>=0?'▲':'▼';
  return `<span class="${c}">${s}${Math.abs(p).toFixed(1)}%</span>`;
}
const PCOL={openai:'#10a37f',anthropic:'#d4a373',google:'#4285f4','x-ai':'#888',
  deepseek:'#4d6bfe',qwen:'#7c3aed','meta-llama':'#0668E1',mistralai:'#ff7000',
  'z-ai':'#e84393',minimax:'#00b894',nvidia:'#76b900',other:'#5a6678'};
const pcol=(p)=>PCOL[p]||'#'+(Math.abs([...p].reduce((a,c)=>a*31+c.charCodeAt(0),7))%0xffffff|0x404040).toString(16).slice(0,6);

// ---- meta line ----
const gen = D.generated_at ? new Date(D.generated_at).toLocaleString('zh-CN',{hour12:false}) : '—';
document.getElementById('meta').innerHTML =
  `数据更新于 <b>${gen}</b> · 数据源：OpenRouter datasets + models + Silicon Data(GPU) + 对照源(Valliance·每日抓取) · 刷新由定时任务驱动`;

// ============================================================ GPU rental (TOP)
const G = D.gpu||{};
if(G.series && Object.keys(G.series).length){
  const sec=$(`<div></div>`);
  sec.appendChild($(`<h2>GPU 租赁价 · Silicon Data (Bloomberg)</h2>`));
  const card=$(`<div class="card"><div class="cs" style="margin-bottom:2px">${G.source||''} · 截至 ${G.as_of||''} · ${G.unit||''}</div>
    <div style="font-size:12px;color:#8b97a8;margin:8px 0 2px">H100 + A100 · 非超大规模指数 (SDH100RT / SDA100RT)</div><div id="c_gpu_h" class="chart" style="height:200px"></div>
    <div style="font-size:12px;color:#8b97a8;margin:16px 0 2px">B200 · SDB200RT</div><div id="c_gpu_b" class="chart" style="height:188px"></div></div>`);
  sec.appendChild(card);
  root.appendChild(sec);
  const names=Object.keys(G.series);
  function gpuChart(elid, specs){
    const multi = specs.length>1;
    echarts.init(document.getElementById(elid),'dark').setOption({
      grid:{left:52,right:18,top:multi?28:12,bottom:22},
      legend: multi?{top:2,textStyle:{color:'#8b97a8',fontSize:10}}:undefined,
      tooltip:{trigger:'axis',valueFormatter:(v)=>v!=null?'$'+(+v).toFixed(2):'—'},
      xAxis:{type:'time',axisLabel:{color:'#8b97a8',fontSize:10}},
      yAxis:{type:'value',scale:true,axisLabel:{color:'#8b97a8',formatter:(v)=>'$'+v.toFixed(2)},splitLine:{lineStyle:{color:'#222b3a'}}},
      series:specs.filter(s=>G.series[s.nm]).map(s=>({type:'line',name:s.nm,smooth:false,showSymbol:false,
        lineStyle:{width:1.4,color:s.color},itemStyle:{color:s.color},
        areaStyle:multi?undefined:{opacity:0.07,color:s.color},
        data:G.series[s.nm].map(p=>[p.date,p.price])}))
    });
  }
  gpuChart('c_gpu_h', [{nm:'H100 (SDH100RT)',color:'#5b9dff'},{nm:'A100 (SDA100RT)',color:'#46c46a'}]);
  gpuChart('c_gpu_b', [{nm:'B200 (SDB200RT)',color:'#e0833f'}]);

  const HM = G.h100_multi;
  if(HM && HM.series){
    card.appendChild($(`<div style="font-size:12px;color:#8b97a8;margin:20px 0 2px">H100 四家指数 · <span style="color:#e8c97a">不收敛</span></div>`));
    card.appendChild($(`<div id="c_gpu_multi" class="chart" style="height:250px"></div>`));
    const COLS={'Compute Desk (Hopper US)':'#5b9dff','Silicon Data (SDH100RT)':'#e8884a','Ornn (ORNNH100)':'#46c46a','SemiAnalysis (1Y contract)':'#a982e6'};
    const estFrom = HM.estimate_from||{};
    const legendData=Object.keys(HM.series);
    const mseries=[];
    legendData.forEach(nm=>{
      const col=COLS[nm]||'#999', pts=HM.series[nm], ef=estFrom[nm];
      const xy=(arr)=>arr.map(p=>[p.date,p.price]);
      if(ef){
        mseries.push({name:nm,type:'line',smooth:true,showSymbol:false,
          lineStyle:{width:1.6,color:col},itemStyle:{color:col},data:xy(pts.filter(p=>p.date<=ef))});
        mseries.push({name:nm+'·估算',type:'line',smooth:true,showSymbol:false,
          lineStyle:{width:1.6,color:col,type:'dashed'},itemStyle:{color:col},data:xy(pts.filter(p=>p.date>=ef))});
      } else {
        mseries.push({name:nm,type:'line',smooth:true,showSymbol:false,
          lineStyle:{width:1.6,color:col},itemStyle:{color:col},data:xy(pts)});
      }
    });
    echarts.init(document.getElementById('c_gpu_multi'),'dark').setOption({
      grid:{left:48,right:16,top:48,bottom:22},
      legend:{data:legendData,top:2,textStyle:{color:'#8b97a8',fontSize:10},type:'scroll'},
      tooltip:{trigger:'axis',valueFormatter:(v)=>v!=null?'$'+(+v).toFixed(2):'—'},
      xAxis:{type:'time',axisLabel:{color:'#8b97a8',fontSize:10}},
      yAxis:{type:'value',scale:true,axisLabel:{color:'#8b97a8',formatter:(v)=>'$'+v.toFixed(2)},splitLine:{lineStyle:{color:'#222b3a'}}},
      series:mseries});
  }

  const TC = G.term_curves;
  if(TC && TC.series){
    card.appendChild($(`<div style="font-size:12px;color:#8b97a8;margin:20px 0 2px">H100 期限利率曲线 · 锁得越久租金越低${TC.as_of?(' · '+TC.as_of):''}</div>`));
    card.appendChild($(`<div id="c_gpu_term" class="chart" style="height:190px"></div>`));
    const TCOL={'2025-11-22':'#5a6678','2026-03-31':'#46c46a','2026-06-25':'#e0833f'};
    const tser=Object.keys(TC.series).map(d=>({name:d,type:'line',smooth:true,symbol:'circle',symbolSize:4,
      lineStyle:{width:1.6,color:TCOL[d]||'#888'},itemStyle:{color:TCOL[d]||'#888'},
      data:TC.x.map((m,i)=>[m, TC.series[d][i]])}));
    echarts.init(document.getElementById('c_gpu_term'),'dark').setOption({
      grid:{left:50,right:16,top:26,bottom:32},
      legend:{top:2,textStyle:{color:'#8b97a8',fontSize:10}},
      tooltip:{trigger:'axis',valueFormatter:(v)=>v!=null?'$'+(+v).toFixed(2):'—'},
      xAxis:{type:'value',name:'期限(月)',nameLocation:'middle',nameGap:22,nameTextStyle:{color:'#8b97a8',fontSize:10},min:0,max:36,axisLabel:{color:'#8b97a8',fontSize:10}},
      yAxis:{type:'value',scale:true,axisLabel:{color:'#8b97a8',formatter:(v)=>'$'+v.toFixed(2)},splitLine:{lineStyle:{color:'#222b3a'}}},
      series:tser});
  }
  const RV = G.residual_value;
  if(RV && RV.data){
    card.appendChild($(`<div style="font-size:12px;color:#8b97a8;margin:18px 0 2px">H100 残值估计 · DCF (USD)${RV.as_of?(' · '+RV.as_of):''}</div>`));
    card.appendChild($(`<div id="c_gpu_rv" class="chart" style="height:180px"></div>`));
    echarts.init(document.getElementById('c_gpu_rv'),'dark').setOption({
      grid:{left:56,right:16,top:12,bottom:22},
      tooltip:{trigger:'axis',valueFormatter:(v)=>v!=null?'$'+(+v).toLocaleString():'—'},
      xAxis:{type:'time',axisLabel:{color:'#8b97a8',fontSize:10}},
      yAxis:{type:'value',scale:true,axisLabel:{color:'#8b97a8',formatter:(v)=>'$'+(v/1000).toFixed(0)+'k'},splitLine:{lineStyle:{color:'#222b3a'}}},
      series:[{type:'line',smooth:true,showSymbol:false,lineStyle:{width:1.6,color:'#b07cf0'},itemStyle:{color:'#b07cf0'},areaStyle:{opacity:0.08,color:'#b07cf0'},
        data:RV.data.map(p=>[p.date,p.value])}]
    });
  }

  // ---- Ornn OCPI 全 SKU（对照源，日频自动） ----
  const OG = VM.gpu_ornn || {};
  if(OG.series && Object.keys(OG.series).length){
    card.appendChild($(`<div style="font-size:12px;color:#8b97a8;margin:20px 0 2px">Ornn OCPI 全 SKU · 日频<b>自动</b>抓取（vs 上方手工维护口径） · 截至 ${OG.as_of||''} · via <a href="https://www.valliance-ailab.com/ai-monetization-tracker/" target="_blank">Valliance</a></div>`));
    card.appendChild($(`<div id="c_gpu_ornn" class="chart" style="height:230px"></div>`));
    const OCOL={'H100 SXM':'#5b9dff','H200':'#46c46a','B200':'#e0833f','A100 SXM4':'#a982e6','RTX 5090':'#5a6678'};
    echarts.init(document.getElementById('c_gpu_ornn'),'dark').setOption({
      grid:{left:48,right:16,top:28,bottom:22},
      legend:{top:2,textStyle:{color:'#8b97a8',fontSize:10},type:'scroll'},
      tooltip:{trigger:'axis',valueFormatter:(v)=>v!=null?'$'+(+v).toFixed(2):'—'},
      xAxis:{type:'time',axisLabel:{color:'#8b97a8',fontSize:10}},
      yAxis:{type:'log',logBase:10,axisLabel:{color:'#8b97a8',formatter:(v)=>'$'+v},splitLine:{lineStyle:{color:'#222b3a'}}},
      series:Object.keys(OG.series).map(nm=>({name:nm,type:'line',smooth:false,showSymbol:false,
        lineStyle:{width:1.4,color:OCOL[nm]||'#999'},itemStyle:{color:OCOL[nm]||'#999'},
        data:OG.series[nm]}))
    });
  }
}

// ============================================================ ARR 实时外推（对照源）
const AR = VM.arr || {};
if(AR.companies && Object.keys(AR.companies).length){
  const sec=$(`<div></div>`);
  sec.appendChild($(`<h2>Frontier Lab ARR · 实时外推估算 <span class="tag">对照源 · via Valliance</span></h2>`));
  const k=$(`<div class="kpis" style="margin-bottom:16px"></div>`);
  const counters=[];
  for(const [key,c] of Object.entries(AR.companies)){
    const ct=c.counter||{};
    k.appendChild($(`<div class="kpi"><div class="v" id="arr_v_${key}" style="font-variant-numeric:tabular-nums;font-size:22px">—</div>
      <div class="l">${c.label||key} — estimated ARR</div>
      <div class="d" id="arr_d_${key}" style="color:var(--mut)"></div></div>`));
    counters.push([key,c,ct]);
  }
  sec.appendChild(k);
  sec.appendChild($(`<div class="card"><h3>ARR 轨迹</h3><div class="cs">实线=历史 · 虚线=外推 · 阴影=不确定带 · ◆=公开报道对照点 · <b>估算模型，非披露值</b> · 模型更新 ${AR.updated||''}</div><div id="c_arr" class="chart tall"></div></div>`));
  root.appendChild(sec);

  function arrTick(){
    const now=Date.now();
    for(const [key,c,ct] of counters){
      if(ct.vLast==null||ct.rMs==null||ct.tLast==null) continue;
      const v = ct.vLast*Math.exp(ct.rMs*(now-ct.tLast));            // $B
      const perHr = v*(Math.exp(ct.rMs*3.6e6)-1)*1e9;                // $/hr
      const yoy = c.yoyDen ? (v/c.yoyDen-1)*100 : null;
      const ve=document.getElementById('arr_v_'+key), de=document.getElementById('arr_d_'+key);
      if(!ve) continue;
      ve.textContent = '$'+(v*1e9).toLocaleString('en-US',{maximumFractionDigits:0});
      de.innerHTML = `+$${perHr.toLocaleString('en-US',{maximumFractionDigits:0})}/hr`+(yoy!=null?` · Y/Y +${yoy.toFixed(0)}%`:'');
    }
  }
  arrTick(); setInterval(arrTick, 1000);

  const aser=[], alegend=[];
  for(const [key,c] of Object.entries(AR.companies)){
    const col=c.color||(key==='anthropic'?'#d4a373':'#10a37f');
    const lb=c.label||key; alegend.push(lb);
    aser.push({name:lb,type:'line',showSymbol:false,smooth:true,
      lineStyle:{width:2,color:col},itemStyle:{color:col},data:c.hist||[]});
    aser.push({name:lb+'·外推',type:'line',showSymbol:false,smooth:true,
      lineStyle:{width:1.6,color:col,type:'dashed'},itemStyle:{color:col},data:c.ext||[]});
    if(c.fanLo&&c.fanHi&&c.fanLo.length===c.fanHi.length&&c.fanLo.length){
      aser.push({name:lb+'·bandlo',type:'line',stack:'fan_'+key,showSymbol:false,silent:true,
        lineStyle:{opacity:0},itemStyle:{color:col},data:c.fanLo,tooltip:{show:false}});
      aser.push({name:lb+'·band',type:'line',stack:'fan_'+key,showSymbol:false,silent:true,
        lineStyle:{opacity:0},areaStyle:{color:col,opacity:0.10},itemStyle:{color:col},
        data:c.fanHi.map((p,i)=>[p[0],p[1]-c.fanLo[i][1]]),tooltip:{show:false}});
    }
    if(c.cps&&c.cps.length){
      aser.push({name:lb+'·对照点',type:'scatter',symbol:'diamond',symbolSize:9,
        itemStyle:{color:col,borderColor:'#e6edf3',borderWidth:1},
        tooltip:{formatter:(p)=>(p.data.src?p.data.src+' · ':'')+'$'+p.data.value[1]+'B'},
        data:c.cps.map(p=>({value:[p.t,p.v],src:p.src}))});
    }
  }
  echarts.init(document.getElementById('c_arr'),'dark').setOption({
    grid:{left:56,right:20,top:30,bottom:26},
    legend:{top:0,data:alegend,textStyle:{color:'#8b97a8',fontSize:10}},
    tooltip:{trigger:'axis',valueFormatter:(v)=>v!=null?'$'+(+v).toFixed(1)+'B':'—'},
    xAxis:{type:'time',axisLabel:{color:'#8b97a8',fontSize:10}},
    yAxis:{type:'value',scale:true,axisLabel:{color:'#8b97a8',formatter:(v)=>'$'+v+'B'},splitLine:{lineStyle:{color:'#222b3a'}}},
    series:aser});
}

// ============================================================ key banner
if(!D.has_key || !(D.rankings&&D.rankings.ok)){
  let why = !D.has_key ? '未检测到 OPENROUTER_API_KEY' :
            ('rankings 未就绪：'+(D.rankings&&D.rankings.reason||'unknown'));
  root.appendChild($(`<div class="banner">
    <b>Token 排名半区未点亮</b>（${why}）。设置环境变量 <code>OPENROUTER_API_KEY=sk-or-...</code> 后重跑
    <code>python3 fetch.py</code>，即可填充每日 token 趋势、提供商份额、Top 模型、Top 应用。
    免费在 openrouter.ai 注册可得 key。当前显示的是无需 key 的<b>模型 landscape</b>。
  </div>`));
}

// ============================================================ KPI cards (landscape)
const L = D.landscape||{};
if(L.ok){
  const price = L.median_prompt_price_per_m!=null ? '$'+L.median_prompt_price_per_m.toFixed(2) : '—';
  const cards=[
    ['模型总数', L.total_models, '当前 OpenRouter 在架'],
    ['提供商', L.total_providers, '不同 author'],
    ['近30天新增', L.new_30d, '新上架模型'],
    ['近7天新增', L.new_7d, '新上架模型'],
    ['推理模型', L.reasoning_models, '支持 reasoning 参数'],
    ['中位 prompt 价', price, '$ / 1M tokens'],
  ];
  const wrap=$(`<div></div>`);
  wrap.appendChild($(`<h2>模型 Landscape · 公开口径</h2>`));
  const k=$(`<div class="kpis"></div>`);
  cards.forEach(([l,v,d])=>k.appendChild($(`<div class="kpi"><div class="v">${typeof v==='number'?v.toLocaleString():v}</div><div class="l">${l}</div><div class="d" style="color:var(--mut)">${d}</div></div>`)));
  wrap.appendChild(k);
  root.appendChild(wrap);
}

// ============================================================ RANKINGS section
const R = D.rankings||{};
if(R.ok){
  const sec=$(`<div></div>`);
  const latest = R.latest_total!=null?hum(R.latest_total):'—';
  sec.appendChild($(`<h2>Token 排名 · OpenRouter 第三方聚合（${R.date_range?R.date_range[0]+' → '+R.date_range[1]:''}）</h2>`));

  // headline KPIs
  const k=$(`<div class="kpis" style="margin-bottom:16px"></div>`);
  k.appendChild($(`<div class="kpi"><div class="v">${latest}</div><div class="l">最新日 token 总量(Top50)</div><div class="d" style="color:var(--mut)">${R.latest_date||''}</div></div>`));
  k.appendChild($(`<div class="kpi"><div class="v">${R.providers_tracked?R.providers_tracked.length:0}</div><div class="l">追踪提供商</div><div class="d" style="color:var(--mut)">其余归 other</div></div>`));
  if(R.total_series&&R.total_series.length>1){
    const a=R.total_series[R.total_series.length-1].tokens, b=R.total_series[0].tokens;
    const g=b?((a-b)/b*100):null;
    k.appendChild($(`<div class="kpi"><div class="v">${g==null?'—':(g>=0?'+':'')+g.toFixed(0)+'%'}</div><div class="l">区间累计变化</div><div class="d">${dod(g)}</div></div>`));
  }
  sec.appendChild(k);

  // charts grid
  const g=$(`<div class="grid g2"></div>`);
  g.appendChild($(`<div class="card"><h3>每日 token 总量</h3><div class="cs">Top50 模型合计 · 单位按需缩放</div><div id="c_total" class="chart"></div></div>`));
  g.appendChild($(`<div class="card"><h3>提供商 token 份额</h3><div class="cs">堆叠 · 谁在涨谁在跌</div><div id="c_prov" class="chart"></div></div>`));
  sec.appendChild(g);

  // top models table
  const tcard=$(`<div class="card" style="margin-top:16px"><h3>最新日 Top 模型</h3><div class="cs">按 token 量 · 含日环比</div></div>`);
  const tbl=$(`<table><thead><tr><th>#</th><th>模型</th><th>提供商</th><th class="num">Token</th><th class="num">日环比</th></tr></thead><tbody></tbody></table>`);
  const tb=tbl.querySelector('tbody');
  (R.top_models||[]).forEach((m,i)=>{
    tb.appendChild($(`<tr><td class="num">${i+1}</td><td>${m.model}</td><td><span class="tag">${m.provider}</span></td><td class="num">${hum(m.tokens)}</td><td class="num">${dod(m.dod_pct)}</td></tr>`));
  });
  tcard.appendChild(tbl);
  sec.appendChild(tcard);
  root.appendChild(sec);

  // render total series
  echarts.init(document.getElementById('c_total'),'dark',{renderer:'canvas'}).setOption(baseLine(
    R.total_series.map(d=>d.date),
    [{name:'tokens',type:'line',smooth:true,areaStyle:{opacity:.18},
      lineStyle:{width:2,color:'#5b9dff'},itemStyle:{color:'#5b9dff'},showSymbol:false,
      data:R.total_series.map(d=>d.tokens)}]));

  // render provider stacked
  const provs=R.providers_tracked;
  const series=provs.map(p=>({name:p,type:'line',stack:'t',smooth:true,
    areaStyle:{opacity:.55},lineStyle:{width:0},showSymbol:false,
    itemStyle:{color:pcol(p)},
    data:R.provider_series.map(d=>d[p]||0)}));
  echarts.init(document.getElementById('c_prov'),'dark').setOption({
    ...baseGrid(), legend:{top:0,textStyle:{color:'#8b97a8',fontSize:10},type:'scroll'},
    tooltip:{trigger:'axis',valueFormatter:hum,axisPointer:{type:'shadow'}},
    xAxis:{type:'category',data:R.provider_series.map(d=>d.date),axisLabel:{color:'#8b97a8',fontSize:10}},
    yAxis:{type:'value',axisLabel:{color:'#8b97a8',formatter:hum},splitLine:{lineStyle:{color:'#222b3a'}}},
    series});
}

// ============================================================ APPS
const A = D.apps||{};
if(A.ok && A.apps && A.apps.length){
  const sec=$(`<div></div>`);
  sec.appendChild($(`<h2>应用排名 · 按 token 用量（trailing 7d）</h2>`));
  const g=$(`<div class="grid g2"></div>`);
  g.appendChild($(`<div class="card"><h3>Top 应用</h3><div class="cs">哪个 app/agent 在烧 token</div><div id="c_apps" class="chart tall"></div></div>`));
  const tcard=$(`<div class="card"><h3>明细</h3><div class="cs">token 与请求数</div></div>`);
  const tbl=$(`<table><thead><tr><th>#</th><th>应用</th><th class="num">Token</th><th class="num">请求</th></tr></thead><tbody></tbody></table>`);
  const tb=tbl.querySelector('tbody');
  A.apps.slice(0,15).forEach(a=>tb.appendChild($(`<tr><td class="num">${a.rank}</td><td>${a.name}</td><td class="num">${hum(a.tokens)}</td><td class="num">${hum(a.requests)}</td></tr>`)));
  tcard.appendChild(tbl);
  g.appendChild(tcard);
  sec.appendChild(g);
  root.appendChild(sec);
  const top=A.apps.slice(0,12).reverse();
  echarts.init(document.getElementById('c_apps'),'dark').setOption({
    ...baseGrid({left:140}), tooltip:{trigger:'axis',valueFormatter:hum,axisPointer:{type:'shadow'}},
    xAxis:{type:'value',axisLabel:{color:'#8b97a8',formatter:hum},splitLine:{lineStyle:{color:'#222b3a'}}},
    yAxis:{type:'category',data:top.map(a=>a.name),axisLabel:{color:'#c9d4e2',fontSize:11}},
    series:[{type:'bar',data:top.map(a=>a.tokens),itemStyle:{color:'#5b9dff',borderRadius:[0,4,4,0]}}]});
}

// ============================================================ LANDSCAPE charts
if(L.ok){
  const sec=$(`<div></div>`);
  sec.appendChild($(`<h2>模型动态 · 公开口径</h2>`));
  const g=$(`<div class="grid g2"></div>`);
  g.appendChild($(`<div class="card"><h3>新模型上架（按月）</h3><div class="cs">来自 models.created · 近24月</div><div id="c_launch" class="chart"></div></div>`));
  g.appendChild($(`<div class="card"><h3>提供商模型数</h3><div class="cs">在架模型计数 Top15</div><div id="c_mix" class="chart"></div></div>`));
  sec.appendChild(g);
  root.appendChild(sec);

  echarts.init(document.getElementById('c_launch'),'dark').setOption({
    ...baseGrid(), tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
    xAxis:{type:'category',data:L.launches_by_month.map(d=>d.month),axisLabel:{color:'#8b97a8',fontSize:10,rotate:45}},
    yAxis:{type:'value',axisLabel:{color:'#8b97a8'},splitLine:{lineStyle:{color:'#222b3a'}}},
    series:[{type:'bar',data:L.launches_by_month.map(d=>d.count),itemStyle:{color:'#3fb950',borderRadius:[3,3,0,0]}}]});

  const mix=L.provider_mix.slice().reverse();
  echarts.init(document.getElementById('c_mix'),'dark').setOption({
    ...baseGrid({left:90}), tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},
    xAxis:{type:'value',axisLabel:{color:'#8b97a8'},splitLine:{lineStyle:{color:'#222b3a'}}},
    yAxis:{type:'category',data:mix.map(d=>d.provider),axisLabel:{color:'#c9d4e2',fontSize:11}},
    series:[{type:'bar',data:mix.map(d=>d.models),itemStyle:{color:(p)=>pcol(mix[p.dataIndex].provider),borderRadius:[0,4,4,0]}}]});
}

// ============================================================ MACRO
const M = D.macro||[];
if(M.length){
  const sec=$(`<div></div>`);
  sec.appendChild($(`<h2>宏观口径 · 第一方/全市场背景（人工维护）</h2>`));
  const card=$(`<div class="card"></div>`);
  const tbl=$(`<table><thead><tr><th>指标</th><th>数值</th><th>时点</th><th>来源</th><th>说明</th></tr></thead><tbody></tbody></table>`);
  const tb=tbl.querySelector('tbody');
  M.forEach(m=>tb.appendChild($(`<tr><td>${m.label}</td><td class="num"><b>${m.value}</b></td><td>${m.as_of||''}</td><td>${m.source||''}${m.verified===false?' <span class="tag verified-no">待核实</span>':''}</td><td style="color:var(--mut);font-size:12px">${m.note||''}</td></tr>`)));
  card.appendChild(tbl);
  card.appendChild($(`<div class="footnote">这些是<b>非自动</b>、需人工核实的参考量，编辑 <code style="color:#ffd479">data/macro.json</code> 维护。用于把 OpenRouter 的聚合层放回市场总量背景里。</div>`));
  sec.appendChild(card);
  root.appendChild(sec);
}

// ============================================================ Vercel Gateway（对照源）
const VC = VM.vercel || {};
if(VC.snapshots && VC.snapshots.length){
  const snap=VC.snapshots[VC.snapshots.length-1];
  const sec=$(`<div></div>`);
  sec.appendChild($(`<h2>Vercel AI Gateway 份额 <span class="tag">对照源 · via Valliance</span></h2>`));
  const g=$(`<div class="grid g2"></div>`);
  g.appendChild($(`<div class="card"><h3>Token 份额 Top10</h3><div class="cs">${snap.date} · 量的口径</div><div id="c_vc_tok" class="chart"></div></div>`));
  g.appendChild($(`<div class="card"><h3>$ Spend 份额 Top10</h3><div class="cs">${snap.date} · 钱的口径（价×量）</div><div id="c_vc_spd" class="chart"></div></div>`));
  sec.appendChild(g);
  const hist=(VC.history&&VC.history.tokens)||{}, chist=(VC.history&&VC.history.cost)||{};
  const fam='Claude (family)';
  const hasFam=hist.days&&hist.series&&hist.series[fam];
  if(hasFam){
    sec.appendChild($(`<div class="card" style="margin-top:16px"><h3>Claude 系份额历史</h3><div class="cs">Token vs $ Spend · 逐日 · 两条线的裂口 = 单价溢价</div><div id="c_vc_hist" class="chart"></div></div>`));
  }
  root.appendChild(sec);
  const hbar=(elid,rows,color)=>{const top=(rows||[]).slice(0,10).reverse();
    echarts.init(document.getElementById(elid),'dark').setOption({
      ...baseGrid({left:150}), tooltip:{trigger:'axis',valueFormatter:(v)=>v+'%',axisPointer:{type:'shadow'}},
      xAxis:{type:'value',axisLabel:{color:'#8b97a8',formatter:(v)=>v+'%'},splitLine:{lineStyle:{color:'#222b3a'}}},
      yAxis:{type:'category',data:top.map(r=>r[0]),axisLabel:{color:'#c9d4e2',fontSize:11}},
      series:[{type:'bar',data:top.map(r=>r[1]),itemStyle:{color,borderRadius:[0,4,4,0]}}]});};
  hbar('c_vc_tok', snap.token_share, '#5b9dff');
  hbar('c_vc_spd', snap.spend_share, '#d4a373');
  if(hasFam){
    const mk=(blk)=>((blk&&blk.days)||[]).map((d,i)=>[d,((blk.series||{})[fam]||[])[i]]);
    echarts.init(document.getElementById('c_vc_hist'),'dark').setOption({
      ...baseGrid(), legend:{top:0,textStyle:{color:'#8b97a8',fontSize:10}},
      tooltip:{trigger:'axis',valueFormatter:(v)=>v!=null?(+v).toFixed(1)+'%':'—'},
      xAxis:{type:'time',axisLabel:{color:'#8b97a8',fontSize:10}},
      yAxis:{type:'value',axisLabel:{color:'#8b97a8',formatter:(v)=>v+'%'},splitLine:{lineStyle:{color:'#222b3a'}}},
      series:[{name:'Token 份额',type:'line',smooth:true,showSymbol:false,lineStyle:{width:1.8,color:'#5b9dff'},itemStyle:{color:'#5b9dff'},data:mk(hist)},
              {name:'$ Spend 份额',type:'line',smooth:true,showSymbol:false,lineStyle:{width:1.8,color:'#d4a373'},itemStyle:{color:'#d4a373'},data:mk(chist)}]});
  }
}

// ============================================================ SDK 下载量（对照源）
const SD = VM.sdk || {};
if(SD.npm || SD.pypi){
  const sec=$(`<div></div>`);
  sec.appendChild($(`<h2>SDK 下载量 · adoption proxy <span class="tag">对照源 · via Valliance</span></h2>`));
  sec.appendChild($(`<div class="card"><h3>npm + PyPI${SD.unit?(' · '+SD.unit):''}</h3><div class="cs">${SD.note||''}</div><div id="c_sdk" class="chart"></div></div>`));
  root.appendChild(sec);
  const lines=[];
  const add=(obj,tag,colmap)=>{for(const [pkg,sv] of Object.entries(obj||{})){
    lines.push({name:`${tag}:${pkg}`,type:'line',smooth:true,showSymbol:false,
      lineStyle:{width:1.4,color:colmap[pkg]||'#888'},itemStyle:{color:colmap[pkg]||'#888'},data:sv});}};
  add(SD.npm,'npm',{'openai':'#10a37f','@anthropic-ai/sdk':'#d4a373'});
  add(SD.pypi,'pypi',{'openai':'#0b8f6f','anthropic':'#8a5a2b'});
  echarts.init(document.getElementById('c_sdk'),'dark').setOption({
    ...baseGrid(), legend:{top:0,textStyle:{color:'#8b97a8',fontSize:10},type:'scroll'},
    tooltip:{trigger:'axis',valueFormatter:(v)=>v!=null?(+v).toFixed(2)+'M':'—'},
    xAxis:{type:'time',axisLabel:{color:'#8b97a8',fontSize:10}},
    yAxis:{type:'value',axisLabel:{color:'#8b97a8',formatter:(v)=>v+'M'},splitLine:{lineStyle:{color:'#222b3a'}}},
    series:lines});
}

// ============================================================ 数据中心（Epoch via 对照源）
const DC = VM.datacenters || {};
if(DC.totals){
  const sec=$(`<div></div>`);
  sec.appendChild($(`<h2>AI 数据中心建设 · Epoch AI <span class="tag">对照源 · via Valliance</span></h2>`));
  const k=$(`<div class="kpis" style="margin-bottom:16px"></div>`);
  [['覆盖 Sites',DC.totals.sites,'卫星影像+permits 样本'],
   ['IT Power',(DC.totals.it_power_gw!=null?DC.totals.it_power_gw:'—')+' GW','设施总功耗另 +20–50%'],
   ['算力存量',(DC.totals.h100_eq_m!=null?DC.totals.h100_eq_m:'—')+'M H100-eq','覆盖样本内累计']]
    .forEach(([l,v,d])=>k.appendChild($(`<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div><div class="d" style="color:var(--mut)">${d}</div></div>`)));
  sec.appendChild(k);
  const g=$(`<div class="grid g2"></div>`);
  g.appendChild($(`<div class="card"><h3>Top Sites by IT Power</h3><div class="cs">截至 ${DC.as_of||''} · Epoch CC-BY 4.0</div><div style="max-height:330px;overflow:auto"><table><thead><tr><th>Site</th><th>Owner</th><th>User</th><th class="num">MW</th><th class="num">kH100e</th></tr></thead><tbody id="dc_tb"></tbody></table></div></div>`));
  g.appendChild($(`<div class="card"><h3>行业累计装机（MW）</h3><div class="cs">前向填充加总 · 当月之后为规划推算（虚线）</div><div id="c_dc" class="chart"></div></div>`));
  sec.appendChild(g);
  root.appendChild(sec);
  const tb=sec.querySelector('#dc_tb');
  (DC.top_sites||[]).slice(0,12).forEach(s=>tb.appendChild($(`<tr><td>${s.name}</td><td><span class="tag">${s.owner}</span></td><td style="color:var(--mut);font-size:12px">${s.user||'—'}</td><td class="num">${s.mw}</td><td class="num">${s.h100e_k}</td></tr>`)));
  const tl=DC.industry_timeline||[], cut=(DC.as_of||'9999').slice(0,7);
  const solid=tl.filter(r=>r[0]<=cut), dash=tl.filter(r=>r[0]>=cut);
  echarts.init(document.getElementById('c_dc'),'dark').setOption({
    ...baseGrid(), legend:{top:0,textStyle:{color:'#8b97a8',fontSize:10}},
    tooltip:{trigger:'axis',valueFormatter:(v)=>v!=null?(+v).toLocaleString()+' MW':'—'},
    xAxis:{type:'time',axisLabel:{color:'#8b97a8',fontSize:10}},
    yAxis:{type:'value',axisLabel:{color:'#8b97a8',formatter:hum},splitLine:{lineStyle:{color:'#222b3a'}}},
    series:[{name:'IT Power',type:'line',smooth:true,showSymbol:false,lineStyle:{width:1.8,color:'#5b9dff'},itemStyle:{color:'#5b9dff'},areaStyle:{opacity:.08,color:'#5b9dff'},data:solid.map(r=>[r[0]+'-01',r[1]])},
            {name:'IT Power·规划',type:'line',smooth:true,showSymbol:false,lineStyle:{width:1.4,color:'#5b9dff',type:'dashed'},itemStyle:{color:'#5b9dff'},data:dash.map(r=>[r[0]+'-01',r[1]])}]});
}

// ============================================================ 对照源署名
if(V){
  root.appendChild($(`<div class="footnote" style="margin-top:18px">对照源署名：标有「对照源」的区块每日自动抓取自
  <a href="https://www.valliance-ailab.com/ai-monetization-tracker/" target="_blank">Valliance AI Lab · AI Monetization Tracker</a>（self-hosted rebuild）。
  其上游：GPU 租赁价 = Ornn Compute Price Index (OCPI)；数据中心 = <a href="https://epoch.ai/data/ai-data-centers" target="_blank">Epoch AI</a>（CC-BY 4.0）；
  Gateway 份额 = Vercel AI Gateway Leaderboards；SDK = npm / PyPI 公开 API。
  <b>ARR 为 Valliance 的外推估算模型，非公司披露值</b>；OpenRouter 数据本站为一手拉取，不经对照源。
  抓取时间 ${V.fetched_at?new Date(V.fetched_at).toLocaleString('zh-CN',{hour12:false}):'—'}。</div>`));
}

// ---- chart helpers ----
function baseGrid(o={}){return{grid:{left:o.left||50,right:20,top:o.top||28,bottom:o.bottom||40},
  backgroundColor:'transparent'};}
function baseLine(x,series){return{...baseGrid(),
  tooltip:{trigger:'axis',valueFormatter:hum},
  xAxis:{type:'category',data:x,boundaryGap:false,axisLabel:{color:'#8b97a8',fontSize:10}},
  yAxis:{type:'value',axisLabel:{color:'#8b97a8',formatter:hum},splitLine:{lineStyle:{color:'#222b3a'}}},
  series};}

window.addEventListener('resize',()=>{document.querySelectorAll('.chart').forEach(el=>{
  const inst=echarts.getInstanceByDom(el); if(inst)inst.resize();});});
})();
</script>
</body>
</html>
