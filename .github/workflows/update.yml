name: refresh-token-radar

# 每 3 小时刷新 + 可手动触发。
# 通过 GitHub Actions 部署 Pages（不再用隐式 branch 部署），
# concurrency 串行 + cancel-in-progress 避免多次部署相撞导致 deploy 失败。
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest token data
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python3 fetch.py

      # 注: 不再把 data.js commit 回仓。data.js 由本次 run 现场构建并打进 Pages
      # artifact 部署，省掉 bot 推送，避免和人工提交相撞。源数据(gpu.json/macro.json)
      # 仍由人工提交进仓，fetch.py 每次从它们 + 实时 API 重建。

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
